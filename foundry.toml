[profile.default]
evm_version = "osaka"
optimizer = true
optimizer_runs = 150
bytecode_hash = "none" # The metadata hash removed from the bytecode (not the metadata itself).
# uncomment this to inspect storage layouts in build artifacts
# extra_output = ["storageLayout"]
verbosity = 3

src = "src"
out = "out"
libs = ["lib", "node_modules"]
cache_path = "cache"

# Forge caps every test call and simulated script run at the block gas limit, keep it out of the way.
block_gas_limit = 1_000_000_000
fuzz = { runs = 256, max_test_rejects = 100_000 }
ffi = true

gas_reports = [
    "VettedGate",
    "PermissionlessGate",
    "Accounting",
    "FeeDistributor",
    "FeeOracle",
    "CSModule",
    "Verifier",
    "ParametersRegistry",
    "AssetRecovererLib",
    "OssifiableProxy",
    "HashConsensus",
]

fs_permissions = [
    { access = "read-write", path = "./out" },
    { access = "read-write", path = "./artifacts" },
    { access = "read", path = "./test/fixtures" },
]

ignored_warnings_from = [
    "src/lib/base-oracle/HashConsensus.sol",
    "test/OssifiableProxy.t.sol",
    "node_modules"
]

# Fast iterations, @see AGENTS.md.
[profile.lite]
solc = "solar"
optimizer = false
fuzz = { runs = 50 }

[profile.ci]
verbosity = 3
eth_rpc_timeout = 120
fuzz = { runs = 10_000, max_test_rejects = 2_000_000 }

[profile.ci_quick]
verbosity = 3
eth_rpc_timeout = 120
fuzz = { runs = 1000, max_test_rejects = 500_000 }

[profile.upgrades]
extra_output = ["storageLayout"]
build_info = true

[lint]
lint_on_build = false
exclude_lints = [
    # Temporarily silence all existing lint findings; we will re-enable them one by one.
    "asm-keccak256",
    "mixed-case-function",
    "mixed-case-variable",
    "named-struct-fields",
    "pascal-case-struct",
    "erc20-unchecked-transfer",
    "incorrect-shift",
    "unsafe-cheatcode",
]

# See more config options https://github.com/foundry-rs/foundry/tree/master/crates/config

[bind_json]
# Only the deployment params structs are (de)serialized as JSON, @see script/utils/JsonBindings.sol.
out = "script/utils/JsonBindings.sol"
include = ["*DeployBase*", "*DeployCSM0x02Base*", "*DeployTwoPhase*"]
